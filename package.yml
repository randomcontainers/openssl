name: openssl
title: OpenSSL
summary: The openssl command for keys, certificates, TLS testing and file encryption, built from the signed release of the newest stable OpenSSL series.
homepage: https://openssl-library.org/
license: Apache-2.0
source-release: true
upstream:
  source: github-release
  repository: openssl/openssl
  # Release tags look like openssl-4.0.3; alpha and beta releases
  # (openssl-4.1.0-beta1) are pre-releases and do not match. Supported series
  # usually release on the same day; the highest version is built.
  tag-pattern: '^openssl-(\d+\.\d+\.\d+)$'
  version-template: '{1}'
  versioning: semver
  version: 4.1.0
  artifact:
    url: https://github.com/openssl/openssl/releases/download/openssl-{version}/openssl-{version}.tar.gz
    checksums:
      url: https://github.com/openssl/openssl/releases/download/openssl-{version}/openssl-{version}.tar.gz.sha256
      algorithm: sha256
    signature: https://github.com/openssl/openssl/releases/download/openssl-{version}/openssl-{version}.tar.gz.asc
    sha256: 50c17baf54cb008f6ce42d50deb4b28050a1aad711636cabd4b241c7e90cc2fd
image:
  entrypoint: [openssl]
  cmd: [help]
test:
  - |
    openssl version > version.txt
    case "$(cat version.txt)" in
      "OpenSSL $VERSION "*"(Library: OpenSSL $VERSION "*) ;;
      *) echo "unexpected version: $(cat version.txt)" >&2; exit 1 ;;
    esac
    path=$(command -v openssl)
    test "$path" = /usr/local/bin/openssl || { echo "openssl is $path" >&2; exit 1; }
    openssl version -d -m > dirs.txt
    printf '%s\n' 'OPENSSLDIR: "/usr/local/ssl"' 'MODULESDIR: "/usr/local/lib/ossl-modules"' > dirs.expected
    cmp dirs.expected dirs.txt || { echo expected: >&2; cat dirs.expected >&2; echo got: >&2; cat dirs.txt >&2; exit 1; }
  - |
    openssl list -providers -provider default -provider legacy > providers.txt
    for name in 'OpenSSL Default Provider' 'OpenSSL Legacy Provider'; do
      grep -Fqx "    name: $name" providers.txt || { echo "missing: $name" >&2; cat providers.txt >&2; exit 1; }
    done
    printf abc > abc.txt
    openssl dgst -md4 -r -provider legacy -provider default abc.txt > md4.txt
    printf '%s\n' 'a448017aaf21d8525fc10ae87aa6729d *abc.txt' > md4.expected
    cmp md4.expected md4.txt || { echo expected: >&2; cat md4.expected >&2; echo got: >&2; cat md4.txt >&2; exit 1; }
    # MD4 is only in the legacy provider, which is not loaded by default.
    if openssl dgst -md4 abc.txt > /dev/null 2>&1; then
      echo 'MD4 works without the legacy provider' >&2
      exit 1
    fi
  - |
    # cert.pem in the OpenSSL directory is the distro's CA bundle, so a root
    # from it verifies against the default CA file alone. Up to ten roots are
    # tried, since a distro update can put one first that has expired or that
    # OpenSSL 4 cannot load.
    awk '/-----BEGIN CERTIFICATE-----/ { n++; f = sprintf("root%02d.pem", n) } f { print > f }
      /-----END CERTIFICATE-----/ { close(f); f = ""; if (n == 10) exit }' \
      /etc/ssl/certs/ca-certificates.crt
    test -s root01.pem || { echo 'no certificate in the CA bundle' >&2; ls -l /etc/ssl/certs/ca-certificates.crt >&2; exit 1; }
    : > verify.txt
    ok=
    for root in root*.pem; do
      if openssl verify -no-CApath -no-CAstore "$root" >> verify.txt 2>&1; then ok=$root; break; fi
    done
    test -n "$ok" || { echo 'no root verified against the default CA file' >&2; cat verify.txt >&2; exit 1; }
    grep -Fqx "$ok: OK" verify.txt || { cat verify.txt >&2; exit 1; }
  - |
    openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -noenc \
      -keyout ec.key -out ec.crt -subj /CN=ec.test -days 1 2> req.err || { cat req.err >&2; exit 1; }
    openssl x509 -in ec.crt -noout -text > ec.txt
    grep -Fq 'ASN1 OID: prime256v1' ec.txt || { cat ec.txt >&2; exit 1; }
    openssl verify -CAfile ec.crt ec.crt > ec.verify 2>&1 || { cat ec.verify >&2; exit 1; }
    grep -Fqx 'ec.crt: OK' ec.verify || { cat ec.verify >&2; exit 1; }
    openssl genpkey -algorithm ML-DSA-65 -out mldsa.key 2> genpkey.err || { cat genpkey.err >&2; exit 1; }
    openssl req -x509 -key mldsa.key -out mldsa.crt -subj /CN=mldsa.test -days 1 2> req.err || { cat req.err >&2; exit 1; }
    openssl x509 -in mldsa.crt -noout -text > mldsa.txt
    grep -Fq 'Signature Algorithm: ML-DSA-65' mldsa.txt || { cat mldsa.txt >&2; exit 1; }
    openssl verify -CAfile mldsa.crt mldsa.crt > mldsa.verify 2>&1 || { cat mldsa.verify >&2; exit 1; }
    grep -Fqx 'mldsa.crt: OK' mldsa.verify || { cat mldsa.verify >&2; exit 1; }
  - |
    # A TLS 1.3 handshake over loopback in which the client offers only the
    # hybrid post-quantum group X25519MLKEM768 and checks the server name
    # against the certificate's subjectAltName.
    openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -noenc \
      -keyout tls.key -out tls.crt -subj /CN=localhost -addext subjectAltName=DNS:localhost \
      -days 1 2> req.err || { cat req.err >&2; exit 1; }
    openssl x509 -in tls.crt -noout -ext subjectAltName > san.txt
    grep -Fq 'DNS:localhost' san.txt || { echo 'expected DNS:localhost' >&2; cat san.txt >&2; exit 1; }
    : > server.log
    openssl s_server -accept 127.0.0.1:8443 -naccept 1 -www -cert tls.crt -key tls.key > server.log 2>&1 &
    server=$!
    i=0
    until grep -q '^ACCEPT' server.log; do
      i=$((i + 1))
      if [ "$i" -gt 30 ]; then echo 's_server did not start' >&2; cat server.log >&2; exit 1; fi
      sleep 1
    done
    if ! openssl s_client -connect 127.0.0.1:8443 -groups X25519MLKEM768 -CAfile tls.crt \
        -verify_hostname localhost -verify_return_error -brief < /dev/null > client.out 2> client.err; then
      cat client.err server.log >&2
      exit 1
    fi
    kill "$server" 2> /dev/null || true
    for line in 'Protocol version: TLSv1.3' 'Verification: OK' 'Verified peername: localhost' \
        'Negotiated TLS1.3 group: X25519MLKEM768'; do
      grep -Fqx "$line" client.err || { echo "missing: $line" >&2; cat client.err >&2; exit 1; }
    done
  - |
    # Encrypted Client Hello over loopback: the server holds the ECH key, and
    # the client encrypts the inner ClientHello for localhost to its public
    # key while the outer one names example.com.
    openssl ech -public_name example.com -out ech.pem
    grep -Fqx -- '-----BEGIN ECHCONFIG-----' ech.pem || { cat ech.pem >&2; exit 1; }
    ecl=$(awk '/^-----END ECHCONFIG-----$/ { p = 0 } p { printf "%s", $0 } /^-----BEGIN ECHCONFIG-----$/ { p = 1 }' ech.pem)
    test -n "$ecl" || { echo 'empty ECHCONFIG block' >&2; cat ech.pem >&2; exit 1; }
    openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -noenc \
      -keyout ech-server.key -out ech-server.crt -subj /CN=localhost -days 1 2> req.err || { cat req.err >&2; exit 1; }
    : > ech-server.log
    openssl s_server -accept 127.0.0.1:8443 -naccept 1 -www -cert ech-server.crt -key ech-server.key \
      -ech_key ech.pem > ech-server.log 2>&1 &
    server=$!
    i=0
    until grep -q '^ACCEPT' ech-server.log; do
      i=$((i + 1))
      if [ "$i" -gt 30 ]; then echo 's_server did not start' >&2; cat ech-server.log >&2; exit 1; fi
      sleep 1
    done
    if ! openssl s_client -connect 127.0.0.1:8443 -servername localhost -CAfile ech-server.crt \
        -ech_config_list "$ecl" < /dev/null > ech-client.out 2> ech-client.err; then
      cat ech-client.out ech-client.err ech-server.log >&2
      exit 1
    fi
    kill "$server" 2> /dev/null || true
    for line in 'ECH: success: 1' 'ECH: inner: localhost' 'ECH: outer: example.com'; do
      grep -Fqx "$line" ech-client.out || { echo "missing: $line" >&2; cat ech-client.out >&2; exit 1; }
    done
examples:
  - title: Print a certificate
    command: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" ghcr.io/randomcontainers/openssl x509 -in cert.pem -noout -text
  - title: Make a key and a self-signed certificate for localhost
    command: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" ghcr.io/randomcontainers/openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -noenc -keyout key.pem -out cert.pem -days 30 -subj /CN=localhost -addext subjectAltName=DNS:localhost
  - title: Check which TLS version, cipher and key exchange a server uses
    command: docker run --rm ghcr.io/randomcontainers/openssl s_client -connect example.org:443 -brief
  - title: Generate an ML-DSA-65 private key
    command: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" ghcr.io/randomcontainers/openssl genpkey -algorithm ML-DSA-65 -out mldsa.key
